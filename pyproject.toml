[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-classification-lab"
version = "1.0.0"
description = "A reproducible introduction to classification, validation, and model comparison"
requires-python = ">=3.12"
dependencies = ["scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "numpy>=1.26,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyterlab>=4,<5", "pandas>=2.2,<3", "nbconvert>=7,<8"]

[project.scripts]
iris-lab = "iris_lab.cli:main"

[tool.setuptools.packages.find]
include = ["iris_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
